services:
  traxo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CACHEBUST: "20261025-v14"
    container_name: traxo_app
    restart: unless-stopped
    expose:
      - "8787"
    networks:
      - dokploy-network
    volumes:
      - traxo_data:/app/.traxo-data
    environment:
      PORT: "8787"
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=768"
      TRAXO_DEMO: "${TRAXO_DEMO:-0}"
      TRAXO_STORE_NAME: "${TRAXO_STORE_NAME:-Davebeauty}"
      TRAXO_STORE_URL: "${TRAXO_STORE_URL:-https://api.daverod.tech}"
      WOOCOMMERCE_URL: "${WOOCOMMERCE_URL:-https://api.daverod.tech}"
      WOOCOMMERCE_KEY: "${WOOCOMMERCE_KEY:-}"
      WOOCOMMERCE_SECRET: "${WOOCOMMERCE_SECRET:-}"
      TRAXO_SESSION_SECRET: "${TRAXO_SESSION_SECRET:-}"
      TRAXO_API_TOKEN: "${TRAXO_API_TOKEN:-}"
      TRAXO_ADMIN_EMAIL: "${TRAXO_ADMIN_EMAIL:-}"
      TRAXO_ADMIN_PASSWORD: "${TRAXO_ADMIN_PASSWORD:-}"
      TRAXO_AUDIT_LIVE: "1"
      MARKET: "VE"
      TRAXO_CURRENCY: "USD"
      TRAXO_SECONDARY_CURRENCY: "VES"
      TRAXO_BCV_RATE: "${TRAXO_BCV_RATE:-880.00}"
      DROPI_MCP_URL: "${DROPI_MCP_URL:-https://mcp.dropi.co/mcp}"
      DROPI_API_URL: "${DROPI_API_URL:-https://api.dropi.com.ve/api}"
      DROPI_API_KEY: "${DROPI_API_KEY:-}"
      # Pasarelas & Pagos Venezuela
      MISPIDI_ENV: "${MISPIDI_ENV:-production}"
      MISPIDI_API_KEY: "${MISPIDI_API_KEY:-}"
      MISPIDI_SECRET_KEY: "${MISPIDI_SECRET_KEY:-}"
      AVILAPAY_ENV: "${AVILAPAY_ENV:-production}"
      AVILAPAY_API_KEY: "${AVILAPAY_API_KEY:-}"
      AVILAPAY_MERCHANT_ID: "${AVILAPAY_MERCHANT_ID:-}"
      BANCRECER_ENV: "${BANCRECER_ENV:-production}"
      BANCRECER_CLIENT_ID: "${BANCRECER_CLIENT_ID:-}"
      BANCRECER_CLIENT_SECRET: "${BANCRECER_CLIENT_SECRET:-}"

      # Inferencia de IA & Modelos LLM
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.3-70b-versatile}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      NVIDIA_MODEL: "${NVIDIA_MODEL:-meta/llama-3.3-70b-instruct}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      XAI_MODEL: "${XAI_MODEL:-grok-2-mini}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}"
      TRAXO_AI: "${TRAXO_AI:-on}"

      # Analítica Web & Grabación de Sesiones
      GA4_PROPERTY_ID: "${GA4_PROPERTY_ID:-}"
      GA4_SERVICE_ACCOUNT_B64: "${GA4_SERVICE_ACCOUNT_B64:-}"
      GA4_CLIENT_EMAIL: "${GA4_CLIENT_EMAIL:-}"
      GA4_PRIVATE_KEY: "${GA4_PRIVATE_KEY:-}"
      CLARITY_PROJECT_ID: "${CLARITY_PROJECT_ID:-}"
      CLARITY_API_TOKEN: "${CLARITY_API_TOKEN:-}"

      # Automatización & Webhooks
      N8N_OUTBOUND_WEBHOOK_URL: "${N8N_OUTBOUND_WEBHOOK_URL:-}"
      N8N_HMAC_SECRET: "${N8N_HMAC_SECRET:-}"
      TRAXO_HMAC_SECRET: "${TRAXO_HMAC_SECRET:-}"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1024M"
        reservations:
          cpus: "0.1"
          memory: "256M"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  traxo_data:
    name: traxo_data
    driver: local

networks:
  dokploy-network:
    external: true
